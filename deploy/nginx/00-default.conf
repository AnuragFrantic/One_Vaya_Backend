# Catch-all: onevaya.ae and admin.onevaya.ae share this IP. Without this, any hostname with no site
# of its own would land on the API. Each site gets its own server_name block and is unaffected.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
